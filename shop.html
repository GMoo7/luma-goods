<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop all — Luma Goods</title><meta name="description" content="Search and filter bags, watches, accessories, home goods and clothing at Luma Goods.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2B3326">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Luma Goods (concept store)">
<meta property="og:title" content="Luma Goods — concept e-commerce store">
<meta property="og:description" content="Portfolio demo: search, filters, variants, cart and checkout.">
<meta property="og:image" content="https://mustufashaikh.github.io/luma-goods/docs/social-preview.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://mustufashaikh.github.io/luma-goods/shop.html">
<link rel="preload" href="fonts/syne-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/luma.css"></head><body>
<main id="main">
<div class="wrap shop-head"><h1 id="title">Shop all</h1><p>Search, filter and sort the full collection.</p></div>
<div class="wrap shop">
<aside class="filters" aria-label="Filters">
<fieldset><legend>Category</legend><div id="f-cats"></div></fieldset>
<fieldset><legend>Colour</legend><div id="f-colors"></div></fieldset>
<fieldset><legend>Price</legend><label for="max">Up to <b id="maxv">$300</b></label><input type="range" id="max" min="20" max="300" step="10" value="300"></fieldset>
<fieldset><legend>Availability</legend><label class="check"><input type="checkbox" id="stock"> In stock only</label><label class="check"><input type="checkbox" id="sale"> On sale</label></fieldset>
</aside>
<div>
<div class="toolbar"><div class="search-box"><label class="sr" for="q">Search products</label><input id="q" type="search" placeholder="Search products"></div>
<button class="btn ghost" id="filters-toggle" aria-expanded="false">Filters</button>
<span id="count" aria-live="polite"></span>
<label><span class="sr">Sort by</span><select id="sort"><option value="featured">Featured</option><option value="newest">Newest</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option><option value="rating">Top rated</option></select></label></div>
<div id="active"></div>
<div class="grid" id="grid" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))"></div>
</div></div></main><script type="module" src="js/shop.js"></script></body></html>
